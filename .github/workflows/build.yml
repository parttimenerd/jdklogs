name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Auto-deploy after a data regen finishes, so a fresh head/21/25 cache goes live on its own
  # (no manual re-run, and no race where a push-triggered build beats the cache being saved).
  # Gated on success below — a failed regen must not trigger a deploy of stale/empty data.
  workflow_run:
    workflows: ["Regenerate data"]
    types: [completed]

# Allow one concurrent deployment; newer pushes cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # For push/workflow_dispatch this is always true; for a workflow_run trigger, only proceed when
    # the upstream "Regenerate data" run succeeded — never deploy off a failed/empty regen.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5

      # Restore the generated site data (head/21/25 .json + *.log + tags.json) that the monthly
      # regen-data.yml wrote to the cache. It is NOT committed to git — this is the only place a
      # build gets it. restore-keys picks the newest site-data-v1-* entry. 21/25 files are
      # best-effort: absent ones simply don't restore, and the frontend auto-detects what's present.
      - name: Restore generated data from cache
        uses: actions/cache/restore@v6
        with:
          path: |
            data/head.json
            data/head.G1.log
            data/head.ZGC.log
            data/head.Parallel.log
            data/21.json
            data/21.G1.log
            data/21.ZGC.log
            data/21.Parallel.log
            data/25.json
            data/25.G1.log
            data/25.ZGC.log
            data/25.Parallel.log
            data/tags.json
          key: site-data-v1-restore-placeholder
          restore-keys: |
            site-data-v1-

      # Fail loudly rather than deploy an empty site if the data cache is missing (e.g. never
      # populated yet, or evicted). Only head + tags are required — 21/25 are best-effort and the
      # frontend lights them up automatically once present. Run `regen-data.yml` to repopulate.
      - name: Verify generated data is present
        working-directory: .
        run: |
          missing=0
          for f in data/head.json data/tags.json; do
            if [ ! -s "$f" ]; then echo "::error::missing generated data: $f"; missing=1; fi
          done
          if [ "$missing" = 1 ]; then
            echo "::error::Generated data cache is empty. Run the 'Regenerate data' workflow (workflow_dispatch) to populate the site-data-v1-* cache, then re-run this build."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # Cache Vite's dependency pre-bundling / transform cache across runs so a push that
      # only changes data/ doesn't repay the cold-start cost. npm deps are already cached
      # by setup-node above.
      - name: Cache Vite build artifacts
        uses: actions/cache@v6
        with:
          path: site/node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}-${{ hashFiles('site/src/**', 'site/vite.config.ts', 'site/tsconfig.json') }}
          restore-keys: |
            vite-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}-
            vite-${{ runner.os }}-

      # Vite resolves the site/public/data symlink at build time, copying the JSON + sample
      # logs into dist/data/. No separate staging step needed.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
